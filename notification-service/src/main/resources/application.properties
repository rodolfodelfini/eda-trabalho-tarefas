spring.application.name=notification-service
server.port=8082

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.connection-timeout=10000

# Retry no consumidor: 3 tentativas (1s, 2s) e depois rejeita sem requeue,
# o que faz o broker encaminhar a mensagem para a DLX configurada na fila
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=5000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# H2 Database (modo arquivo)
spring.datasource.url=jdbc:h2:file:./data/notificationdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ Exchange, Queues e Routing Keys
rabbitmq.exchange.name=task.exchange
rabbitmq.queue.notification=notification.queue
rabbitmq.routing.created=task.created
rabbitmq.routing.updated=task.updated

# DLQ (Dead Letter Queue)
rabbitmq.dlx.name=task.dlx
rabbitmq.queue.notification-dlq=notification.dlq
rabbitmq.routing.dlq=task.dlq.routing
