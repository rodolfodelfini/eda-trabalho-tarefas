spring.application.name=analytics-service
server.port=8083

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.connection-timeout=10000

# H2 Database (modo arquivo)
spring.datasource.url=jdbc:h2:file:./data/analyticsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ Exchange, Queues e Routing Keys
rabbitmq.exchange.name=task.exchange
rabbitmq.queue.analytics=analytics.queue
rabbitmq.routing.created=task.created
